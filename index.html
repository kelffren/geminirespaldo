(function(){

    if(sessionStorage.getItem('kelo.world.updater.pendingBuild.v5')&&!window.__KELO_UPDATE_EARLY_HEALTH__){

      var record=function(type,message){
        if(health.errors.length>=10)health.errors.shift();
        health.errors.push({type:type,message:String(message||type),at:Date.now()});

      var onEarlyError=function(event){record('error',event&&event.message||'early_error');};

        }
        return mesh;
      }).catch(function(error){console.error('[Kelo Recovery Mesh boot]',error);return null;});
    }
  }catch(e){}
})();
