name: Tree Pack PNG Contract CI

on:
  pull_request:
    paths:
      - 'src/environment/kelo-tree-pack-01-manifest.json'
      - 'scripts/validate-png-pipeline.mjs'
      - 'assets/world/trees/kelo-tree-pack-01/**'
      - '.github/workflows/tree-pack-png-contract-ci.yml'
  workflow_dispatch:

jobs:
  validate-tree-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: node --check scripts/validate-png-pipeline.mjs
      - name: Tree pack manifest contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('src/environment/kelo-tree-pack-01-manifest.json','utf8'));
          if(manifest.version!=='kelo-tree-pack-01-v1') throw new Error(`TREE_PACK_VERSION:${manifest.version}`);
          if(!Array.isArray(manifest.items)||manifest.items.length!==12) throw new Error(`TREE_PACK_ITEMS:${manifest.items?.length}`);
          const ids=new Set(),files=new Set();
          for(const item of manifest.items){
            if(!item?.id||ids.has(item.id)) throw new Error(`TREE_PACK_ID:${item?.id}`);
            if(!item?.file||files.has(item.file)||!/\.png$/i.test(item.file)) throw new Error(`TREE_PACK_FILE:${item?.file}`);
            if(!Array.isArray(item.native)||item.native.length!==2||item.native.some(v=>!Number.isInteger(Number(v))||Number(v)<=0)) throw new Error(`TREE_PACK_NATIVE:${item.id}`);
            ids.add(item.id);files.add(item.file);
          }
          console.log(`TREE_PACK_MANIFEST_OK items=${manifest.items.length}`);
          NODE
      - name: Canonical PNG pipeline
        run: node scripts/validate-png-pipeline.mjs
