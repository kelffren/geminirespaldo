name: Image Treatment LIVE audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/creators/core/image-treatment-engine.mjs'
      - 'src/creators/ui/sprite-factory-online.mjs'
      - 'scripts/live-image-treatment-audit.mjs'
      - '.github/workflows/image-treatment-live-audit.yml'

concurrency:
  group: image-treatment-live-main
  cancel-in-progress: true

jobs:
  live-image-treatment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Syntax check
        run: node --check scripts/live-image-treatment-audit.mjs
      - name: Wait for Image Treatment Engine on GitHub Pages
        run: |
          for i in $(seq 1 180); do
            if curl -fsSL "https://kelffren.github.io/gemini/src/creators/core/image-treatment-engine.mjs?audit=${GITHUB_SHA}-${i}" | grep -q 'image-treatment-v1.0.0'; then
              exit 0
            fi
            sleep 1
          done
          echo 'Timed out waiting for Image Treatment Engine deployment' >&2
          exit 1
      - name: Run native treatment + Sprite Factory bridge in LIVE browser
        env:
          AUDIT_URL: https://kelffren.github.io/gemini/
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/live-image-treatment-audit.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-treatment-live-evidence
          path: artifacts/image-treatment-live.png
          if-no-files-found: ignore
