name: Map Forge Decoration Seam CI
on:
  push:
    branches: [main]
    paths:
      - 'src/world/map-forge/**'
      - 'scripts/map-forge-decoration-seam-audit.mjs'
      - '.github/workflows/map-forge-decoration-seam-ci.yml'
  pull_request:
    paths:
      - 'src/world/map-forge/**'
      - 'scripts/map-forge-decoration-seam-audit.mjs'
      - '.github/workflows/map-forge-decoration-seam-ci.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/world/map-forge/map-forge-builder.mjs
          node --check scripts/map-forge-decoration-seam-audit.mjs
      - name: Cross-district decoration spacing
        run: node scripts/map-forge-decoration-seam-audit.mjs
