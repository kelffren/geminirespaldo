name: Studio History Hints CI
on:
  push:
    branches: [main]
    paths:
      - 'src/studio/ui/studio-history-hints.mjs'
      - 'src/studio/studio-entry.mjs'
      - 'scripts/studio-history-hints-audit.mjs'
      - 'package.json'
      - '.github/workflows/studio-history-hints-ci.yml'
  pull_request:
    paths:
      - 'src/studio/ui/studio-history-hints.mjs'
      - 'src/studio/studio-entry.mjs'
      - 'scripts/studio-history-hints-audit.mjs'
      - 'package.json'
      - '.github/workflows/studio-history-hints-ci.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/studio/ui/studio-history-hints.mjs
          node --check src/studio/studio-entry.mjs
          node --check scripts/studio-history-hints-audit.mjs
      - name: Contextual history hints contract
        run: npm run audit:studio:history-hints
