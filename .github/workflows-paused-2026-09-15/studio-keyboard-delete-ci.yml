name: Studio Keyboard Delete CI

on:
  push:
    branches: [main]
    paths:
      - 'src/studio/input/studio-keyboard-delete-controller.mjs'
      - 'src/studio/studio-entry.mjs'
      - 'scripts/studio-keyboard-delete-audit.mjs'
      - 'package.json'
      - '.github/workflows/studio-keyboard-delete-ci.yml'
  pull_request:
    paths:
      - 'src/studio/input/studio-keyboard-delete-controller.mjs'
      - 'src/studio/studio-entry.mjs'
      - 'scripts/studio-keyboard-delete-audit.mjs'
      - 'package.json'
      - '.github/workflows/studio-keyboard-delete-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyboard-delete-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check src/studio/input/studio-keyboard-delete-controller.mjs
          node --check src/studio/studio-entry.mjs
          node --check scripts/studio-keyboard-delete-audit.mjs
      - name: Keyboard delete contract
        run: npm run audit:studio:keyboard-delete
