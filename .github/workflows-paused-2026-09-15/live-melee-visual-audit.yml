name: Live Perceptual Combat Feel Agent
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/systems/pvp-world.js'
      - 'src/systems/melee/**'
      - 'src/visuals/visual-manifests.js'
      - 'src/visuals/melee-visual-manifest.js'
      - 'src/visuals/melee-combat-visuals.js'
      - 'src/visuals/combat-presentation-bridge.js'
      - 'src/visuals/melee-assets/**'
      - 'assets/fx/melee/**'
      - 'scripts/live-melee-perceptual-audit.mjs'
      - '.github/workflows/live-melee-visual-audit.yml'
  workflow_dispatch:

concurrency:
  group: live-perceptual-combat-feel-main
  cancel-in-progress: true

jobs:
  live-mobile-perceptual-combat-feel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for exact Pages combat runtime
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, time, urllib.request

          base='https://kelffren.github.io/gemini/'
          targets=[
              'index.html',
              'src/systems/pvp-world.js',
              'src/systems/melee/melee-engine.js',
              'src/systems/melee/melee-weapon-profiles.js',
              'src/visuals/melee-visual-manifest.js',
              'src/visuals/melee-combat-visuals.js',
              'src/visuals/combat-presentation-bridge.js',
          ]
          expected={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in targets}
          for attempt in range(48):
              mismatches=[]
              for path in targets:
                  try:
                      url=base+path+'?deploy-sha='+str(time.time_ns())
                      body=urllib.request.urlopen(url, timeout=15).read()
                      actual=hashlib.sha256(body).hexdigest()
                      if actual != expected[path]:
                          mismatches.append((path, expected[path][:10], actual[:10]))
                  except Exception as exc:
                      mismatches.append((path, 'fetch', str(exc)[:40]))
              if not mismatches:
                  print('Exact perceptual combat runtime from this checkout is live on Pages')
                  raise SystemExit(0)
              print('Pages not current yet', attempt+1, mismatches)
              time.sleep(10)
          raise SystemExit('Exact perceptual combat runtime did not appear on Pages')
          PY
      - name: Play and score perceptible mobile melee
        env:
          AUDIT_URL: https://kelffren.github.io/gemini/
          PERCEPTUAL_MOTION_THRESHOLD: '90'
        run: node scripts/live-melee-perceptual-audit.mjs
      - name: Upload perceptual combat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-perceptual-combat-feel-agent
          path: artifacts/melee-live-perceptual/
          if-no-files-found: error
          retention-days: 14
