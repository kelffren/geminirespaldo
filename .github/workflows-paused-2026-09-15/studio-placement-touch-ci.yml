name: Studio Placement Touch CI

on:
  push:
    branches: [main]
    paths:
      - 'src/studio/input/studio-placement-touch-controller.mjs'
      - 'src/studio/studio-entry.mjs'
      - 'scripts/studio-placement-touch-audit.mjs'
      - 'package.json'
      - '.github/workflows/studio-placement-touch-ci.yml'
  pull_request:
    paths:
      - 'src/studio/input/studio-placement-touch-controller.mjs'
      - 'src/studio/studio-entry.mjs'
      - 'scripts/studio-placement-touch-audit.mjs'
      - 'package.json'
      - '.github/workflows/studio-placement-touch-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placement-touch-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check src/studio/input/studio-placement-touch-controller.mjs
          node --check scripts/studio-placement-touch-audit.mjs
      - name: Placement touch contract
        run: npm run audit:studio:placement-touch
