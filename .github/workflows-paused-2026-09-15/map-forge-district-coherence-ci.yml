name: Map Forge District Coherence CI
on:
  push:
    branches: [main]
    paths:
      - 'src/world/map-forge/**'
      - 'scripts/map-forge-district-coherence-audit.mjs'
      - '.github/workflows/map-forge-district-coherence-ci.yml'
  pull_request:
    paths:
      - 'src/world/map-forge/**'
      - 'scripts/map-forge-district-coherence-audit.mjs'
      - '.github/workflows/map-forge-district-coherence-ci.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/world/map-forge/map-forge-quality.mjs
          node --check scripts/map-forge-district-coherence-audit.mjs
      - name: District coherence across 300 maps
        run: node scripts/map-forge-district-coherence-audit.mjs
