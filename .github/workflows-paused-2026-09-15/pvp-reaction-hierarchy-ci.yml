name: PvP Reaction Hierarchy CI

on:
  push:
    branches: [main]
    paths:
      - 'src/visuals/melee-combat-visuals.js'
      - 'src/visuals/melee-visual-manifest.js'
      - 'scripts/audit-pvp-reaction-hierarchy.js'
      - 'scripts/live-pvp-reaction-hierarchy-judge.mjs'
      - '.github/workflows/pvp-reaction-hierarchy-ci.yml'
  workflow_dispatch:

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit 60 90 120 Hz reaction hierarchy
        run: node scripts/audit-pvp-reaction-hierarchy.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve exact checkout
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kelo-reaction-http.log 2>&1 &
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  if urllib.request.urlopen('http://127.0.0.1:4173/index.html',timeout=1).status==200: raise SystemExit(0)
              except Exception: time.sleep(.2)
          raise SystemExit('server failed')
          PY
      - name: Judge mobile and desktop recoil hierarchy
        env:
          AUDIT_URL: http://127.0.0.1:4173/
        run: node scripts/live-pvp-reaction-hierarchy-judge.mjs
      - name: Foundation architecture
        run: npm run audit:foundation
