name: Kelo Animation Creator
on:
  pull_request:
    paths:
      - 'src/creators/**'
      - 'src/studio/core/**'
      - 'src/studio/ui/studio-timeline.mjs'
      - 'src/studio/ui/studio-workspace-shell.mjs'
      - 'src/visuals/animation-system.js'
      - 'src/systems/admin-key-system.js'
      - 'src/ui/studio-launcher.js'
      - 'scripts/animation-creator-audit.mjs'
      - 'scripts/animation-creator-live-audit.mjs'
      - '.github/workflows/animation-creator.yml'
  push:
    branches: [main]
    paths:
      - 'src/creators/animation/**'
      - 'src/creators/workspaces/animation-workspace.mjs'
      - 'src/studio/core/studio-kernel.mjs'
      - 'src/studio/ui/studio-timeline.mjs'
      - 'src/studio/ui/studio-workspace-shell.mjs'
      - 'src/visuals/animation-system.js'
      - 'scripts/animation-creator-*.mjs'
      - '.github/workflows/animation-creator.yml'
  workflow_dispatch:

jobs:
  animation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/creators/animation/animation-document.mjs
          node --check src/creators/animation/animation-commands.mjs
          node --check src/creators/animation/animation-preview-adapter.mjs
          node --check src/creators/animation/animation-live-controller.mjs
          node --check src/creators/workspaces/animation-workspace.mjs
          node --check src/creators/repository/indexeddb-creator-state-adapter.mjs
          node --check src/creators/creator-entry.mjs
          node --check src/creators/ui/creator-hub.mjs
          node --check src/studio/core/studio-kernel.mjs
          node --check src/studio/ui/studio-timeline.mjs
          node --check src/studio/ui/studio-workspace-shell.mjs
          node --check src/visuals/animation-system.js
          node --check src/systems/admin-key-system.js
          node --check scripts/animation-creator-audit.mjs
          node --check scripts/animation-creator-live-audit.mjs
      - name: Animation architecture contract
        run: node scripts/animation-creator-audit.mjs

  animation-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - name: Serve candidate
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/animation-creator-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/animation-creator-http.log
          exit 1
      - name: Audit Animation Creator at 390x844
        env:
          AUDIT_URL: http://127.0.0.1:8000/
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/animation-creator-live-audit.mjs
      - name: Upload Animation Creator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-creator-audit
          path: artifacts/
          if-no-files-found: warn
