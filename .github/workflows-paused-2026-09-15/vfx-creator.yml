name: Kelo VFX Creator
on:
  pull_request:
    paths:
      - 'src/creators/**'
      - 'src/studio/core/**'
      - 'src/studio/ui/studio-timeline.mjs'
      - 'src/studio/ui/studio-workspace-shell.mjs'
      - 'src/visuals/fx-system.js'
      - 'src/systems/admin-key-system.js'
      - 'scripts/vfx-creator-audit.mjs'
      - 'scripts/vfx-creator-live-audit.mjs'
      - '.github/workflows/vfx-creator.yml'
  push:
    branches: [main]
    paths:
      - 'src/creators/vfx/**'
      - 'src/creators/workspaces/vfx-workspace.mjs'
      - 'src/creators/core/workspace-draft-autosave.mjs'
      - 'src/creators/creator-entry.mjs'
      - 'src/creators/ui/creator-hub.mjs'
      - 'src/studio/core/studio-kernel.mjs'
      - 'src/studio/ui/studio-timeline.mjs'
      - 'src/studio/ui/studio-workspace-shell.mjs'
      - 'src/visuals/fx-system.js'
      - 'src/systems/admin-key-system.js'
      - 'scripts/vfx-creator-*.mjs'
      - '.github/workflows/vfx-creator.yml'
  workflow_dispatch:

jobs:
  vfx-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/creators/vfx/vfx-document.mjs
          node --check src/creators/vfx/vfx-commands.mjs
          node --check src/creators/vfx/vfx-preview-adapter.mjs
          node --check src/creators/vfx/vfx-live-controller.mjs
          node --check src/creators/workspaces/vfx-workspace.mjs
          node --check src/creators/core/workspace-draft-autosave.mjs
          node --check src/creators/creator-entry.mjs
          node --check src/creators/ui/creator-hub.mjs
          node --check src/studio/core/studio-kernel.mjs
          node --check src/studio/ui/studio-timeline.mjs
          node --check src/studio/ui/studio-workspace-shell.mjs
          node --check src/visuals/fx-system.js
          node --check src/systems/admin-key-system.js
          node --check scripts/vfx-creator-audit.mjs
          node --check scripts/vfx-creator-live-audit.mjs
      - name: VFX architecture contract
        run: node scripts/vfx-creator-audit.mjs

  vfx-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - name: Serve candidate
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/vfx-creator-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/vfx-creator-http.log
          exit 1
      - name: Audit VFX Creator at 390x844
        env:
          AUDIT_URL: http://127.0.0.1:8000/
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/vfx-creator-live-audit.mjs
      - name: Upload VFX Creator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-creator-audit
          path: artifacts/
          if-no-files-found: warn
