name: Map Forge tree asset binding
on:
  push:
    branches: [main]
    paths:
      - 'src/world/map-forge/**'
      - 'tests/map-forge-tree-asset-binding.mjs'
      - '.github/workflows/map-forge-tree-binding.yml'
  pull_request:
    paths:
      - 'src/world/map-forge/**'
      - 'tests/map-forge-tree-asset-binding.mjs'
      - '.github/workflows/map-forge-tree-binding.yml'
  workflow_dispatch:

jobs:
  tree-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check src/world/map-forge/map-forge-sprite-manifest.mjs
      - name: Deterministic Kelo tree binding
        run: node tests/map-forge-tree-asset-binding.mjs
