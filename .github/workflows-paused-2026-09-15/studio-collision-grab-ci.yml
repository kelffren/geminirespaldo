name: Studio Collision Grab CI

on:
  push:
    branches: [main]
    paths:
      - 'src/studio/tools/collision-tool.mjs'
      - 'scripts/studio-collision-grab-offset-audit.mjs'
      - 'package.json'
      - '.github/workflows/studio-collision-grab-ci.yml'
  pull_request:
    paths:
      - 'src/studio/tools/collision-tool.mjs'
      - 'scripts/studio-collision-grab-offset-audit.mjs'
      - 'package.json'
      - '.github/workflows/studio-collision-grab-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collision-grab-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check src/studio/tools/collision-tool.mjs
          node --check scripts/studio-collision-grab-offset-audit.mjs
      - name: Collision grab contract
        run: npm run audit:studio:collision-grab
