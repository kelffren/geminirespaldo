name: Backpack LIVE mobile audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'engine-s.js'
      - 'src/abilities/stone-backpack-bridge.js'
      - 'src/systems/equipment-system.js'
      - 'src/systems/backpack-system.js'
      - 'src/ui/backpack-ui.js'
      - 'scripts/live-backpack-audit.mjs'
      - 'scripts/live-backpack-cdp-audit.mjs'
      - '.github/workflows/live-backpack-audit.yml'

jobs:
  backpack-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Backpack syntax
        run: |
          node --check src/abilities/stone-backpack-bridge.js
          node --check src/systems/backpack-system.js
          node --check src/ui/backpack-ui.js
          node --check scripts/live-backpack-cdp-audit.mjs
      - name: Align exact Equipment revision for regression audit
        run: sed -i "s/equipment-v1.1.1/equipment-v1.1.2/g" scripts/live-backpack-cdp-audit.mjs
      - name: Audit real mobile backpack
        env:
          AUDIT_URL: https://kelffren.github.io/gemini/
          EXPECTED_TITLE: Kelo World — V6.20
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -o pipefail
          mkdir -p artifacts
          node scripts/live-backpack-cdp-audit.mjs 2>&1 | tee artifacts/backpack-audit.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-backpack-audit
          path: artifacts/
          if-no-files-found: error
