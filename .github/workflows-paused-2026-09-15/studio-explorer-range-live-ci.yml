name: Studio Explorer Range Live CI

on:
  push:
    branches: [main]
    paths:
      - 'src/studio/studio-entry.mjs'
      - 'src/studio/input/studio-explorer-range-selection-controller.mjs'
      - 'src/studio/input/studio-explorer-reveal-controller.mjs'
      - 'scripts/studio-explorer-range-live-audit.mjs'
      - 'package.json'
      - '.github/workflows/studio-explorer-range-live-ci.yml'
  pull_request:
    paths:
      - 'src/studio/studio-entry.mjs'
      - 'src/studio/input/studio-explorer-range-selection-controller.mjs'
      - 'src/studio/input/studio-explorer-reveal-controller.mjs'
      - 'scripts/studio-explorer-range-live-audit.mjs'
      - 'package.json'
      - '.github/workflows/studio-explorer-range-live-ci.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check integration
        run: |
          node --check src/studio/studio-entry.mjs
          node --check src/studio/input/studio-explorer-range-selection-controller.mjs
          node --check src/studio/input/studio-explorer-reveal-controller.mjs
          node --check scripts/studio-explorer-range-live-audit.mjs
      - name: Explorer range live contract
        run: npm run audit:studio:explorer-range-live
