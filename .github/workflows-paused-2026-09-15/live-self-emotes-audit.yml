name: Self interaction + Emotes LIVE mobile audit
on:
  push:
    branches: [main]
    paths:
      - 'src/systems/backpack-system.js'
      - 'src/systems/container-system.js'
      - 'src/systems/emote-system.js'
      - 'src/ui/backpack-ui.js'
      - 'src/ui/self-interaction-ui.js'
      - 'scripts/live-self-emotes-cdp-audit.mjs'
      - '.github/workflows/live-self-emotes-audit.yml'
      - 'index.html'
  workflow_dispatch:
jobs:
  self-emotes-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/systems/container-system.js
          node --check src/systems/emote-system.js
          node --check src/ui/self-interaction-ui.js
          node --check scripts/live-self-emotes-cdp-audit.mjs
      - name: Audit real mobile self interaction and emotes
        env:
          AUDIT_URL: https://kelffren.github.io/gemini/
          EXPECTED_TITLE: Kelo World — V6.23
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -o pipefail
          mkdir -p artifacts
          node scripts/live-self-emotes-cdp-audit.mjs 2>&1 | tee artifacts/self-emotes-audit.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-self-emotes-audit
          path: artifacts/
          if-no-files-found: error
