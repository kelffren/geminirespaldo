name: Import Arboleskelo1 irregular atlas

on:
  push:
    branches: [ main ]
    paths:
      - 'assets/Arboleskelo1.PNG'
      - 'scripts/import_asset_sheet.py'
      - '.github/workflows/import-arboleskelo1-atlas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install importer dependencies
        run: pip install pillow numpy opencv-python-headless
      - name: Build irregular atlas + metadata + preview
        run: |
          python3 scripts/import_asset_sheet.py assets/Arboleskelo1.PNG \
            --atlas assets/Arboleskelo1.atlas.png \
            --json assets/Arboleskelo1.atlas.json \
            --js src/environment/generated/arboleskelo1-atlas.js \
            --preview docs/asset-previews/Arboleskelo1.preview.png
      - name: Validate generated outputs
        run: |
          python3 - <<'PY'
          import json
          from PIL import Image
          meta=json.load(open('assets/Arboleskelo1.atlas.json'))
          assert meta['version']=='kelo-irregular-atlas-v1'
          assert 'tree_large' in meta['frames']
          f=meta['frames']['tree_large']
          assert f['w']>=300 and f['h']>=350, f
          im=Image.open('assets/Arboleskelo1.atlas.png')
          assert im.mode=='RGBA' and im.size==(meta['width'],meta['height'])
          print('ATLAS_VALIDATE_OK', len(meta['frames']), f)
          PY
      - name: Upload preview for visual audit
        uses: actions/upload-artifact@v4
        with:
          name: arboleskelo1-atlas-preview
          path: |
            docs/asset-previews/Arboleskelo1.preview.png
            assets/Arboleskelo1.atlas.json
      - name: Commit generated atlas outputs
        run: |
          git config user.name 'kelo-art-bot'
          git config user.email '68343904+kelffren@users.noreply.github.com'
          git add assets/Arboleskelo1.atlas.png assets/Arboleskelo1.atlas.json src/environment/generated/arboleskelo1-atlas.js docs/asset-previews/Arboleskelo1.preview.png
          if git diff --cached --quiet; then
            echo 'atlas outputs already current'
            exit 0
          fi
          git commit -m 'Generate Arboleskelo1 irregular atlas'
          git push origin HEAD:main
