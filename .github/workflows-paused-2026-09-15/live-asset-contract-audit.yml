name: Live Asset Contract Audit
on:
  push:
    branches: [main]
    paths:
      - 'src/environment/art-asset-manifest.json'
      - 'scripts/live-asset-contract-audit.mjs'
      - '.github/workflows/live-asset-contract-audit.yml'
  workflow_dispatch:
jobs:
  audit-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright package
        run: npm install --no-save playwright@1.55.0
      - name: Audit published Asset Contract on mobile
        env:
          AUDIT_URL: https://kelffren.github.io/gemini/
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/live-asset-contract-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-asset-contract-audit
          path: artifacts/
          if-no-files-found: error
