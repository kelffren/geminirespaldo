name: Studio Directional Marquee CI

on:
  pull_request:
    paths:
      - 'src/studio/tools/marquee-select-tool.mjs'
      - 'scripts/studio-directional-marquee-audit.mjs'
      - '.github/workflows/studio-directional-marquee-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/studio/tools/marquee-select-tool.mjs'
      - 'scripts/studio-directional-marquee-audit.mjs'
      - '.github/workflows/studio-directional-marquee-ci.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check src/studio/tools/marquee-select-tool.mjs
          node --check scripts/studio-directional-marquee-audit.mjs
      - name: Directional marquee contract
        run: npm run audit:studio:directional-marquee
