name: Backpack CI
on:
  push:
    branches: [main]
    paths:
      - 'src/core/input-lock-system.js'
      - 'src/core/input-gate.js'
      - 'src/systems/backpack-system.js'
      - 'src/systems/equipment-item-catalog.js'
      - 'src/systems/equipment-system.js'
      - 'src/systems/container-system.js'
      - 'src/systems/market-escrow-system.js'
      - 'src/systems/commerce-authority.js'
      - 'src/systems/emote-system.js'
      - 'src/ui/backpack-ui.js'
      - 'src/ui/backpack-fantasy-v1.css'
      - 'src/ui/modal-input-lock.js'
      - 'src/ui/warehouse-ui.js'
      - 'src/ui/market-ui.js'
      - 'src/ui/commerce-ui.js'
      - 'src/ui/self-interaction-ui.js'
      - 'src/ui/character-customizer-ui.js'
      - 'scripts/backpack-system-audit.js'
      - 'scripts/container-system-audit.js'
      - 'scripts/market-escrow-audit.js'
      - 'scripts/commerce-system-audit.js'
      - 'scripts/emote-system-audit.js'
      - 'scripts/inventory-ui-v2-audit.js'
      - '.github/workflows/backpack-ci.yml'
      - 'index.html'
  pull_request:
    paths:
      - 'src/core/input-lock-system.js'
      - 'src/core/input-gate.js'
      - 'src/systems/backpack-system.js'
      - 'src/systems/equipment-item-catalog.js'
      - 'src/systems/equipment-system.js'
      - 'src/systems/container-system.js'
      - 'src/systems/market-escrow-system.js'
      - 'src/systems/commerce-authority.js'
      - 'src/systems/emote-system.js'
      - 'src/ui/backpack-ui.js'
      - 'src/ui/backpack-fantasy-v1.css'
      - 'src/ui/modal-input-lock.js'
      - 'src/ui/warehouse-ui.js'
      - 'src/ui/market-ui.js'
      - 'src/ui/commerce-ui.js'
      - 'src/ui/self-interaction-ui.js'
      - 'src/ui/character-customizer-ui.js'
      - 'scripts/backpack-system-audit.js'
      - 'scripts/container-system-audit.js'
      - 'scripts/market-escrow-audit.js'
      - 'scripts/commerce-system-audit.js'
      - 'scripts/emote-system-audit.js'
      - 'scripts/inventory-ui-v2-audit.js'
      - '.github/workflows/backpack-ci.yml'
      - 'index.html'
  workflow_dispatch:
jobs:
  backpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check src/core/input-lock-system.js
          node --check src/core/input-gate.js
          node --check src/systems/equipment-item-catalog.js
          node --check src/systems/equipment-system.js
          node --check src/systems/backpack-system.js
          node --check src/systems/container-system.js
          node --check src/systems/market-escrow-system.js
          node --check src/systems/commerce-authority.js
          node --check src/systems/emote-system.js
          node --check src/ui/modal-input-lock.js
          node --check src/ui/backpack-ui.js
          node --check src/ui/warehouse-ui.js
          node --check src/ui/market-ui.js
          node --check src/ui/commerce-ui.js
          node --check src/ui/self-interaction-ui.js
          node --check src/ui/character-customizer-ui.js
          node --check scripts/backpack-system-audit.js
          node --check scripts/container-system-audit.js
          node --check scripts/market-escrow-audit.js
          node --check scripts/commerce-system-audit.js
          node --check scripts/emote-system-audit.js
          node --check scripts/inventory-ui-v2-audit.js
      - name: Backpack mechanics
        run: node scripts/backpack-system-audit.js
      - name: Container mechanics
        run: node scripts/container-system-audit.js
      - name: Market Escrow mechanics
        run: node scripts/market-escrow-audit.js
      - name: Commerce mechanics
        run: node scripts/commerce-system-audit.js
      - name: Emote loadout mechanics
        run: node scripts/emote-system-audit.js
      - name: Inventory UI V2 contract
        run: node scripts/inventory-ui-v2-audit.js
      - name: Integration contract
        run: |
          grep -q "equipment-v1.3.0" src/systems/equipment-system.js
          grep -q "marketEscrowAwareStarterIdentity:true" src/systems/equipment-system.js
          grep -q "backpack-v1.1.0" src/systems/backpack-system.js
          grep -q "stacksImplemented:true" src/systems/backpack-system.js
          grep -q "splitImplemented:true" src/systems/backpack-system.js
          grep -q "container-v1.4.0" src/systems/container-system.js
          grep -q "strictDestinationCapacity:true" src/systems/container-system.js
          grep -q "warehouseImplemented:true" src/systems/container-system.js
          grep -q "marketEscrowImplemented:true" src/systems/container-system.js
          grep -q "escrowMerge:false" src/systems/market-escrow-system.js
          grep -q "tradeEscrowImplemented:true" src/systems/container-system.js
          grep -q "checkpointTransactions:true" src/systems/container-system.js
          grep -q "emoteLoadoutImplemented:true" src/systems/container-system.js
          grep -q "emote-loadout-v1.0.0" src/systems/emote-system.js
          grep -q "noDuplicateInBackpackWhileEquipped:true" src/systems/emote-system.js
          grep -q "market-escrow-v1.0.0" src/systems/market-escrow-system.js
          grep -q "listingContract:'validate-transfer-create-persist-rollback-v1'" src/systems/market-escrow-system.js
          grep -q "cancelContract:'validate-transfer-close-persist-rollback-v1'" src/systems/market-escrow-system.js
          grep -q "commerce-authority-v1.1.0" src/systems/commerce-authority.js
          grep -q "equipmentCatalogMarketFixtures:true" src/systems/commerce-authority.js
          grep -q "tradeDoubleConfirmation:true" src/systems/commerce-authority.js
          grep -Eq "backpack-ui-v2\.[0-9]+\.[0-9]+" src/ui/backpack-ui.js
          grep -q "locks.acquire('backpack-ui'" src/ui/backpack-ui.js
          grep -q "inputLockTokenized:true" src/ui/backpack-ui.js
          ! grep -Eq "KELO_MODAL_INPUT_LOCK[[:space:]]*=" src/ui/backpack-ui.js
          grep -q "modal-input-lock-v2.0.0-retired" src/ui/modal-input-lock.js
          grep -q "replacementOwner:'KeloInputLocks'" src/ui/modal-input-lock.js
          grep -q "warehouse-ui-v1.0.1" src/ui/warehouse-ui.js
          grep -q "market-ui-v1.1.0-commerce-compat" src/ui/market-ui.js
          grep -q "backpackPublishAction:true" src/ui/market-ui.js
          grep -q "authorityBoundary:'KeloCommerceAuthority'" src/ui/market-ui.js
          grep -Eq "self-interaction-ui-v1\.[0-9]+\.[0-9]+" src/ui/self-interaction-ui.js
          grep -q "locks.acquire(owner" src/ui/self-interaction-ui.js
          grep -q "inputLockOwner:'KeloInputLocks'" src/ui/self-interaction-ui.js
          grep -q "tokenLocks:true" src/ui/self-interaction-ui.js
          grep -q "legacyModalWrites:false" src/ui/self-interaction-ui.js
          grep -q "profileUsesCharacterCustomizer:true" src/ui/self-interaction-ui.js
          grep -q "profileFallbackUsesBackpackUI:true" src/ui/self-interaction-ui.js
          grep -q "KeloCharacterCustomizer" src/ui/self-interaction-ui.js