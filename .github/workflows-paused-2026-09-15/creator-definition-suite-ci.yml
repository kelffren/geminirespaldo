name: Creator Definition Suite CI

on:
  pull_request:
    paths:
      - 'src/creators/definition/**'
      - 'src/creators/workspaces/definition-workspaces.mjs'
      - 'src/creators/creator-entry.mjs'
      - 'src/creators/ui/creator-hub.mjs'
      - 'scripts/creator-definition-suite-audit.mjs'
      - 'package.json'
      - '.github/workflows/creator-definition-suite-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/creators/definition/**'
      - 'src/creators/workspaces/definition-workspaces.mjs'
      - 'src/creators/creator-entry.mjs'
      - 'src/creators/ui/creator-hub.mjs'
      - 'scripts/creator-definition-suite-audit.mjs'
      - 'package.json'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check Creator Suite
        run: |
          node --check src/creators/definition/definition-specs.mjs
          node --check src/creators/definition/generic-definition-studio.mjs
          node --check src/creators/workspaces/definition-workspaces.mjs
          node --check src/creators/creator-entry.mjs
          node --check src/creators/ui/creator-hub.mjs
      - name: Audit prompt definitions and routing
        run: npm run audit:creator-suite
