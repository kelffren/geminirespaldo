name: Kelo Studio LIVE click audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/studio/**'
      - 'src/creators/**'
      - 'src/ui/studio-launcher.js'
      - 'src/ui/account-auth-ui.js'
      - 'src/core/camera-system.js'
      - 'index.html'
      - 'scripts/live-studio-open-smoke.mjs'
      - 'scripts/live-studio-click-audit.mjs'
      - '.github/workflows/live-studio-click-audit.yml'

concurrency:
  group: kelo-studio-live-click-main
  cancel-in-progress: true

jobs:
  click-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Syntax check live audits
        run: |
          node --check scripts/live-studio-open-smoke.mjs
          node --check scripts/live-studio-click-audit.mjs
      - name: Wait for editor account-gate hotfix on Pages
        run: |
          for i in $(seq 1 180); do
            if curl -fsSL "https://kelffren.github.io/gemini/src/ui/account-auth-ui.js?audit=${GITHUB_SHA}-${i}" | grep -q 'kelo-account-auth-ui-v1.0.1-editor-bypass'; then
              exit 0
            fi
            sleep 1
          done
          echo 'Timed out waiting for account-auth-ui editor bypass deployment' >&2
          exit 1
      - name: Smoke open MENÚ → CREATORS → World on GitHub Pages
        env:
          AUDIT_URL: https://kelffren.github.io/gemini/
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/live-studio-open-smoke.mjs
      - name: Deep interaction audit on GitHub Pages
        env:
          AUDIT_URL: https://kelffren.github.io/gemini/
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/live-studio-click-audit.mjs
