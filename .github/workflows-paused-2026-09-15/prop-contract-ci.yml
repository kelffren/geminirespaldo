name: Generic Prop Contract CI
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/environment/prop-contract.js'
      - 'src/environment/generic-props.js'
      - 'src/environment/environment-layer-stack.js'
      - 'src/physics/collision-utils.js'
      - 'scripts/validate-prop-contract.mjs'
      - '.github/workflows/prop-contract-ci.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'src/environment/prop-contract.js'
      - 'src/environment/generic-props.js'
      - 'src/environment/environment-layer-stack.js'
      - 'src/physics/collision-utils.js'
      - 'scripts/validate-prop-contract.mjs'
      - '.github/workflows/prop-contract-ci.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-prop-contract.mjs
