<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#game-canvas{width:100%;height:100%;display:block;touch-action:none}#ui-layer{position:absolute;inset:0;pointer-events:none}.zbl{position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));z-index:2147483000;max-height:48dvh;overflow:auto;padding:10px;border:1px solid rgba(231,197,106,.45);border-radius:16px;background:rgba(5,12,15,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.zbl h1{font-size:14px;color:#f0d27d}.zbl p{font-size:10px;color:#aab9b4;margin:4px 0 8px}.zbl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.zbl button{min-height:42px;border-radius:11px;border:1px solid rgba(231,197,106,.4);background:#132529;color:#f5dc94;font-weight:800}.zbl button:disabled{opacity:.45}.zbl-stats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.zbl-pill{font-size:9px;padding:5px 7px;border-radius:999px;background:#0e2024;border:1px solid rgba(255,255,255,.08)}#zbl-log{font:9px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:#b9ccc5;white-space:pre-wrap;max-height:92px;overflow:auto;border-top:1px solid rgba(255,255,255,.07);padding-top:7px}.zbl-ok{color:#99df9e}.zbl-bad{color:#ffaaa0}
</style>
</head>
<body>

</section>
<script>

</script>

<script>
(function(){
'use strict';
var Lab=window.KeloBootStageLab;
Lab.configure({
  visual:{label:'Visual Core',files:[
    'src/core/camera-follow-shadow.js?v=1','src/core/camera-system.js?v=1','src/core/avatar-render-system.js?v=2-base-zoo-authority','src/core/render-extension-system.js?v=3','src/core/simulation-extension-system.js?v=4-sim-owner','src/core/simulation-farm-shadow.js?v=1'
  ]},
  legacy:{label:'Legacy World',depends:['visual'],files:[
    'engine-d.js?v=95','engine-e.js?v=94','engine-f.js?v=95','engine-g.js?v=96','src/environment/mobile-performance-contract.js?v=2-cache-working-set','engine-h.js?v=151','engine-i.js?v=94','engine-j.js?v=94','engine-k.js?v=94'
  ]},
  environment:{label:'Environment',depends:['legacy'],files:[
    'src/environment/rural-nature-atlas.js?v=200','src/environment/gardens-atlas.js?v=2','src/environment/gardens-joins.js?v=3','src/environment/terrain-contract.js?v=1','src/environment/generated/arboleskelo1-atlas.js?v=1','src/environment/tile-registry.js?v=237','src/environment/atlas-contract.js?v=4','src/environment/gardens-t-junction-registry.js?v=1','src/environment/district-decals-registry.js?v=3','src/environment/gardens-compositions.js?v=10','src/environment/world-map.js?v=terrain-191','src/environment/environment-layer-stack.js?v=4','src/environment/surface-ground.js?v=1','src/environment/prop-contract.js?v=7-map-probe','src/environment/generic-props.js?v=9','src/environment/prefab-contract.js?v=1','engine-l.js?v=223'
  ]},
  ui:{label:'UI completa',depends:['environment'],files:[
    'src/ui/luxe-shell.js?v=231','src/ui/mobile-orientation.js?v=6','src/ui/luxe-player-hud.js?v=4-minimap-live-20260914','src/systems/performance-governor.js?v=4-boot-ready'
  ]}
});
var log=document.getElementById('zbl-log'),loaded=document.getElementById('zbl-loaded'),transfer=document.getElementById('zbl-transfer'),decoded=document.getElementById('zbl-decoded');
function kb(n){return (Number(n||0)/1024).toFixed(1)+' KB';}
function line(text,cls){var d=document.createElement('div');if(cls)d.className=cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;}
function refresh(){var s=Lab.getState().state;loaded.textContent='Capas '+s.loaded.length+'/4';transfer.textContent='Red '+kb(s.totalTransfer);decoded.textContent='JS '+kb(s.totalDecoded);}
window.addEventListener('kelo:zero-boot:file-end',function(e){var d=e.detail;line('✓ '+d.stage+' · '+d.src+' · '+d.wallMs+'ms · '+kb(d.transferSize),'zbl-ok');refresh();});
window.addEventListener('kelo:zero-boot:file-error',function(e){line('✕ '+e.detail.src,'zbl-bad');refresh();});
window.addEventListener('kelo:zero-boot:throttle',function(e){line('PAUSA frame '+e.detail.frameMs+'ms');});
window.addEventListener('kelo:zero-boot:stage-end',function(e){line('ETAPA LISTA: '+e.detail.label,'zbl-ok');refresh();});
document.querySelectorAll('[data-stage]').forEach(function(btn){btn.addEventListener('click',function(){var stage=btn.getAttribute('data-stage');btn.disabled=true;line('CARGANDO '+stage+'…');Lab.loadStage(stage).then(function(ok){line(ok?'OK '+stage:'FALLO '+stage,ok?'zbl-ok':'zbl-bad');}).catch(function(err){line('ERROR '+String(err&&err.message||err),'zbl-bad');}).finally(function(){btn.disabled=false;refresh();});});});
refresh();
})();
</script>
