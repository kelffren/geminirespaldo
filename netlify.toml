# KELO WORLD — host-agnostic Netlify adapter
# GitHub remains the source of truth. Netlify is the primary static CDN target;
# GitHub Pages remains a fallback until another compatible edge target is enabled.
# Compression policy: Netlify CDN negotiates Brotli/Gzip automatically; this is
# NEVER accepted from configuration/comment alone and is live-tested by
# scripts/turbo-live-host-audit.mjs before the Turbo Guardian may pass.

[build]
  command = "npm install --no-save --ignore-scripts esbuild@0.25.9 && npm run build"
  publish = "."

# Never let control-plane documents become stale.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/dist/turbo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security baseline for the static game surface.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
