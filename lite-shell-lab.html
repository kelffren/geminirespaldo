(function(){
  const out=document.getElementById('lsl-metric');
  function kb(n){return (Number(n||0)/1024).toFixed(1)+'KB';}
  function refresh(label){
    const entries=performance.getEntriesByType('resource').filter(function(e){return /luxe-shell|mobile-orientation|luxe-player-hud|lite-shell-gate/.test(e.name);});
    const tx=entries.reduce(function(n,e){return n+(Number(e.transferSize)||0);},0),decoded=entries.reduce(function(n,e){return n+(Number(e.decodedBodySize)||0);},0);
    out.textContent=(label||'Lite')+' · UI red '+kb(tx)+' · decoded '+kb(decoded)+' · full='+(!!window.KELO_LUXE);
  }
  addEventListener('load',function(){refresh('BOOT');},{once:true});
  addEventListener('kelo:lite-shell:file-end',function(){refresh('UPGRADE');});
  addEventListener('kelo:lite-shell:upgrade-end',function(){refresh('LISTO');});
})();
